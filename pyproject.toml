[project]
name = "mediassist-ai"
version = "0.1.0"
description = "Local-first educational healthcare AI assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "pymupdf>=1.24,<2",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "argon2-cffi>=23.1,<26",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
ai = ["sentence-transformers>=3.0,<4", "faiss-cpu>=1.8,<2", "pytesseract>=0.3,<1", "Pillow>=10,<12"]
explainability = ["shap>=0.46,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

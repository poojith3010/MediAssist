services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediassist
      POSTGRES_USER: mediassist
      POSTGRES_PASSWORD: mediassist
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:
